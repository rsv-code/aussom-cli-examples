name: hellogtk
version: 1.0.0
description: Installer project for hellogtk.
license: Apache-2.0
author: Austin Lehman
authorEmail: cupofcode@yahoo.com
type: pure
dependencies: { }
installer:
  enabled: true
  appName: hellogtk
  version: 1.0.0
  vendor: Austin Lehman
  copyright: Copyright 2026 Austin Lehman
  description: GTK4 Hello World app.
  mainScript: hellogtk.aus
  appArgs: [ ]
  javaOptions:
  - --enable-native-access=ALL-UNNAMED
  - --add-opens=java.base/jdk.internal.module=ALL-UNNAMED
  linux:
    # icon: package-files/icons/app.png    # uncomment + drop a 1024x1024 PNG here
    types:
    - deb
    shortcut: true
    fileAssociations: [ ]
    launchers: [ ]
    javaOptions: [ ]
    bundle:
      fx: false
      gtk4: true
      extraJars: [ ]
      extraResources: [ ]
    signing:
      enabled: false
  windows:
    # icon: package-files/icons/app.ico    # uncomment + drop a multi-resolution ICO here
    types:
    - msi
    shortcut: true
    fileAssociations: [ ]
    launchers: [ ]
    javaOptions: [ ]
    bundle:
      fx: false
      gtk4: true
      extraJars: [ ]
      extraResources: [ ]
    signing:
      enabled: false
      identity: ''
  macos:
    # icon: package-files/icons/app.icns    # uncomment + drop an ICNS bundle here
    types:
    - pkg
    shortcut: false
    fileAssociations: [ ]
    launchers: [ ]
    javaOptions: [ ]
    bundle:
      fx: false
      gtk4: true
      extraJars: [ ]
      extraResources: [ ]
    signing:
      enabled: false
      identity: ''
